<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dezimalzeichen – Helsana Corporate Language</title>
  <style>
    :root { --green: #4caf50; --red: #d9534f; --text: #111; --muted: #666; }
    * { box-sizing: border-box; }
    body { font-family: "Helvetica Neue", Arial, sans-serif; color: var(--text); line-height: 1.5; max-width: 860px; margin: 0 auto; padding: 48px 24px; }
    h1 { font-size: 2.75rem; font-weight: 400; margin: 0 0 2rem; }
    h2 { font-size: 1.15rem; margin: 2rem 0 .75rem; }
    .callout { background: #faeaea; color: #c0392b; padding: 1.25rem 1.5rem 1.25rem 3.25rem; margin: 2rem 0; position: relative; }
    .callout::before { content: "📢"; position: absolute; left: 1.1rem; top: 1.2rem; }
    .note { background: #f0f0f0; color: #555; padding: 1.25rem 1.5rem; margin: 1.5rem 0; }
    table { border-collapse: collapse; width: 100%; margin: 1rem 0 1.5rem; }
    table.grid th, table.grid td { border: 1px solid #ddd; padding: .6rem .9rem; text-align: left; vertical-align: top; }
    table.compare { table-layout: fixed; }
    table.compare th { font-size: 1.2rem; text-align: left; padding: .25rem 0 .7rem; background: no-repeat bottom left / calc(100% - 1.25rem) 3px; }
    table.compare th.good { color: var(--green); background-image: linear-gradient(var(--green), var(--green)); }
    table.compare th.bad { color: var(--red); background-image: linear-gradient(var(--red), var(--red)); background-position: bottom right; }
    table.compare th + th, table.compare td + td { padding-left: 2.5rem; }
    table.compare td { padding: .6rem 0; vertical-align: top; }
    td p { margin: 0 0 .5rem; }
    td p:last-child { margin-bottom: 0; }
    .good::before, .bad::before { font-weight: 700; margin-right: .4rem; }
    table.compare.icons th.good::before { content: "✓"; }
    table.compare.icons th.bad::before { content: "✗"; }
    footer { border-top: 1px solid #e5e5e5; margin-top: 3rem; padding-top: 1rem; color: var(--muted); font-size: .85rem; }
  </style>
</head>
<body>
  <main>
  <h1>Dezimalzeichen</h1>
  <p>Im deutschen Sprachraum verwenden wir als Dezimalzeichen das Komma.</p>
  <div class="callout"><strong>Ausnahme</strong>: <strong>Franken und Rappen</strong> trennen wir mit Punkt. Das gilt auch bei anderen Währungen.</div>
  <table class="compare">
    <thead><tr><th class="good">richtig</th><th class="bad">falsch</th></tr></thead>
    <tbody>
      <tr><td>45,2 Liter<br>CHF 46.60<br>CHF 45,2 Mio.</td><td>45.2 Liter<br>CHF 45,60<br>CHF 45.2 Mio.</td></tr>
    </tbody>
  </table>
  </main>
  <footer>Last modified on Mon, 10. Nov 2025 07:33</footer>
</body>
</html>
